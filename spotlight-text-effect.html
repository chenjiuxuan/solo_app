<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聚光灯文字遮罩效果</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .spotlight-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dark-background {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse at 20% 30%, #1a1a2e 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, #16213e 0%, transparent 50%),
        linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #0a0a0f 100%);
      z-index: 1;
    }

    .colorful-background {
      position: absolute;
      inset: 0;
      background: 
        conic-gradient(
          from 0deg at 50% 50%,
          #ff006e 0deg,
          #8338ec 60deg,
          #3a86ff 120deg,
          #06ffa5 180deg,
          #ffbe0b 240deg,
          #fb5607 300deg,
          #ff006e 360deg
        );
      z-index: 2;
    }

    .text-mask-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spotlight-svg {
      width: 100%;
      height: 100%;
      max-width: 1200px;
    }

    .spotlight-cursor {
      position: fixed;
      width: 200px;
      height: 200px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 100;
      transition: width 0.3s, height 0.3s;
    }
  </style>
</head>
<body>
  <div class="spotlight-container" id="container">
    <div class="dark-background"></div>
    <div class="colorful-background"></div>

    <div class="text-mask-layer">
      <svg class="spotlight-svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid meet">
        <defs>
          <mask id="spotlight-mask">
            <rect x="0" y="0" width="1200" height="400" fill="black"/>
            <circle id="spotlight-circle" cx="600" cy="200" r="150" fill="white"/>
          </mask>

          <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ff006e"/>
            <stop offset="25%" stop-color="#8338ec"/>
            <stop offset="50%" stop-color="#3a86ff"/>
            <stop offset="75%" stop-color="#06ffa5"/>
            <stop offset="100%" stop-color="#ffbe0b"/>
          </linearGradient>
        </defs>

        <text 
          x="600" 
          y="200" 
          text-anchor="middle" 
          dominant-baseline="middle"
          font-size="120"
          font-weight="900"
          font-family="Arial, sans-serif"
          fill="url(#text-gradient)"
          mask="url(#spotlight-mask)"
          style="letter-spacing: 0.05em;"
        >
          SPOTLIGHT
        </text>

        <text 
          x="600" 
          y="280" 
          text-anchor="middle" 
          dominant-baseline="middle"
          font-size="32"
          font-weight="300"
          font-family="Arial, sans-serif"
          fill="url(#text-gradient)"
          mask="url(#spotlight-mask)"
          style="letter-spacing: 0.3em;"
        >
          INTERACTIVE EFFECT
        </text>
      </svg>
    </div>

    <div class="spotlight-cursor" id="cursor"></div>
  </div>

  <script>
    const container = document.getElementById('container');
    const spotlightCircle = document.getElementById('spotlight-circle');
    const cursor = document.getElementById('cursor');
    const svg = document.querySelector('.spotlight-svg');
    
    const spotlightRadius = 180;
    
    function updateSpotlight(clientX, clientY) {
      const svgRect = svg.getBoundingClientRect();
      const svgX = clientX - svgRect.left;
      const svgY = clientY - svgRect.top;
      const viewBoxX = (svgX / svgRect.width) * 1200;
      const viewBoxY = (svgY / svgRect.height) * 400;
      
      spotlightCircle.setAttribute('cx', viewBoxX);
      spotlightCircle.setAttribute('cy', viewBoxY);
      cursor.style.left = clientX + 'px';
      cursor.style.top = clientY + 'px';
    }

    container.addEventListener('mousemove', (e) => {
      updateSpotlight(e.clientX, e.clientY);
    });

    container.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      updateSpotlight(touch.clientX, touch.clientY);
    });

    let autoAnimationId = null;
    let isInteracting = false;
    let autoAngle = 0;

    function startAutoAnimation() {
      if (autoAnimationId) return;
      
      autoAnimationId = requestAnimationFrame(function animate() {
        if (isInteracting) {
          autoAnimationId = null;
          return;
        }
        
        autoAngle += 0.02;
        const centerX = 600;
        const centerY = 200;
        const radiusX = 400;
        const radiusY = 100;
        
        const x = centerX + Math.cos(autoAngle) * radiusX;
        const y = centerY + Math.sin(autoAngle * 0.5) * radiusY;
        
        spotlightCircle.setAttribute('cx', x);
        spotlightCircle.setAttribute('cy', y);
        
        autoAnimationId = requestAnimationFrame(animate);
      });
    }

    container.addEventListener('mouseenter', () => {
      isInteracting = true;
      cursor.style.opacity = '1';
    });

    container.addEventListener('mouseleave', () => {
      isInteracting = false;
      cursor.style.opacity = '0';
      startAutoAnimation();
    });

    container.addEventListener('touchstart', () => {
      isInteracting = true;
    });

    container.addEventListener('touchend', () => {
      isInteracting = false;
      startAutoAnimation();
    });

    startAutoAnimation();

    container.addEventListener('mousedown', () => {
      spotlightCircle.setAttribute('r', spotlightRadius * 1.3);
      cursor.style.width = '260px';
      cursor.style.height = '260px';
    });

    container.addEventListener('mouseup', () => {
      spotlightCircle.setAttribute('r', spotlightRadius);
      cursor.style.width = '200px';
      cursor.style.height = '200px';
    });
  </script>
</body>
</html>
