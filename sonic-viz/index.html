<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonic Viz</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#f8f6f3;
    overflow:hidden;
    font-family:system-ui,sans-serif;
  }
  canvas{display:block}
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// ── 场景 / 相机 / 渲染器 ──
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.5, 200);
camera.position.set(18, 16, 22);
camera.lookAt(0, -1.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0); // 透明背景
document.body.appendChild(renderer.domElement);

// ── 光照 ──
const ambient = new THREE.AmbientLight(0xc8d8e8, 0.6);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(20, 25, 10);
scene.add(dirLight);

const dirLight2 = new THREE.DirectionalLight(0xd8c8e8, 0.5);
dirLight2.position.set(-15, 8, -10);
scene.add(dirLight2);

// ── 自定义 ShaderMaterial ──
const vertexShader = /* glsl */ `
  varying vec3 vPos;
  varying vec3 vNormal;
  varying float vHeight;
  varying vec2 vUv;
  uniform float uTime;
  uniform float uAudioLevel;

  // Simplex 3D 噪声
  vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
  vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
  vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
  vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}

  float snoise(vec3 v){
    const vec2 C=vec2(1.0/6.0,1.0/3.0);
    const vec4 D=vec4(0.0,0.5,1.0,2.0);
    vec3 i=floor(v+dot(v,C.yyy));
    vec3 x0=v-i+dot(i,C.xxx);
    vec3 g=step(x0.yzx,x0.xyz);
    vec3 l=1.0-g;
    vec3 i1=min(g.xyz,l.zxy);
    vec3 i2=max(g.xyz,l.zxy);
    vec3 x1=x0-i1+C.xxx;
    vec3 x2=x0-i2+C.yyy;
    vec3 x3=x0-D.yyy;
    i=mod289(i);
    vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
    float n_=0.142857142857;
    vec3 ns=n_*D.wyz-D.xzx;
    vec4 j=p-49.0*floor(p*ns.z*ns.z);
    vec4 x_=floor(j*ns.z);
    vec4 y_=floor(j-7.0*x_);
    vec4 x=x_*ns.x+ns.yyyy;
    vec4 y=y_*ns.x+ns.yyyy;
    vec4 h=1.0-abs(x)-abs(y);
    vec4 b0=vec4(x.xy,y.xy);
    vec4 b1=vec4(x.zw,y.zw);
    vec4 s0=floor(b0)*2.0+1.0;
    vec4 s1=floor(b1)*2.0+1.0;
    vec4 sh=-step(h,vec4(0.0));
    vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
    vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
    vec3 p0=vec3(a0.xy,h.x);
    vec3 p1=vec3(a0.zw,h.y);
    vec3 p2=vec3(a1.xy,h.z);
    vec3 p3=vec3(a1.zw,h.w);
    vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
    p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
    vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
    m=m*m;
    return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
  }

  void main(){
    vec3 pos=position;
    // 多层噪声叠加
    float n1=snoise(pos*0.25+uTime*0.15)*1.8;
    float n2=snoise(pos*0.5+uTime*0.2)*0.9;
    float n3=snoise(pos*0.8+uTime*0.12)*0.5;
    float height=n1+n2+n3;

    // 中心区域更高
    float dist=length(pos.xz)*0.12;
    float centerFactor=smoothstep(4.0,0.0,dist)*0.6;
    height+=centerFactor;

    pos.y+=height;

    vPos=pos;
    vHeight=height;
    vUv=uv;

    // 计算法线
    float eps=0.2;
    float hx=snoise(vec3(pos.x+eps,pos.y,pos.z)*0.25+uTime*0.15)*1.8+snoise(vec3(pos.x+eps,pos.y,pos.z)*0.5+uTime*0.2)*0.9;
    float hz=snoise(vec3(pos.x,pos.y,pos.z+eps)*0.25+uTime*0.15)*1.8+snoise(vec3(pos.x,pos.y,pos.z+eps)*0.5+uTime*0.2)*0.9;
    vec3 tanX=normalize(vec3(eps,hx-height,0.0));
    vec3 tanZ=normalize(vec3(0.0,hz-height,eps));
    vNormal=normalize(cross(tanZ,tanX));

    gl_Position=projectionMatrix*modelViewMatrix*vec4(pos,1.0);
  }
`;

const fragmentShader = /* glsl */ `
  varying vec3 vPos;
  varying vec3 vNormal;
  varying float vHeight;
  varying vec2 vUv;
  uniform float uTime;

  void main(){
    vec3 lightDir=normalize(vec3(0.6,0.8,0.4));
    vec3 lightDir2=normalize(vec3(-0.4,0.3,-0.5));

    float diff=max(dot(vNormal,lightDir),0.0);
    float diff2=max(dot(vNormal,lightDir2),0.0)*0.4;

    // 颜色：薄荷绿到淡紫的渐变
    vec3 colorLow=mix(vec3(0.56,0.72,0.65),vec3(0.68,0.78,0.82),vHeight*0.3+0.3);
    vec3 colorMid=mix(vec3(0.72,0.78,0.70),vec3(0.65,0.62,0.78),vHeight*0.2);
    vec3 colorHigh=mix(vec3(0.78,0.75,0.80),vec3(0.70,0.65,0.82),vHeight*0.15);

    float t=smoothstep(-1.0,1.5,vHeight);
    vec3 color=mix(colorLow,colorMid,smoothstep(0.2,0.6,t));
    color=mix(color,colorHigh,smoothstep(0.6,1.0,t));

    // 光照
    float ambient=0.35;
    float lighting=ambient+diff*0.55+diff2*0.2;

    // 边缘高光
    float rim=1.0-abs(dot(vNormal,vec3(0.0,0.0,1.0)));
    rim=pow(rim,3.0)*0.15;

    vec3 finalColor=color*lighting+rim*vec3(0.82,0.85,0.88);

    // 雾效
    float fog=1.0-exp(-vPos.z*0.015);
    finalColor=mix(finalColor,vec3(0.97,0.96,0.95),fog*0.3);

    gl_FragColor=vec4(finalColor,1.0);
  }
`;

// ── 地形网格 ──
const terrainSize = 24;
const segments = 150;
const geometry = new THREE.PlaneGeometry(terrainSize, terrainSize, segments, segments);
geometry.rotateX(-Math.PI / 2);

const uniforms = {
  uTime: { value: 0 },
  uAudioLevel: { value: 0 },
};

const material = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms,
  side: THREE.DoubleSide,
});

const terrain = new THREE.Mesh(geometry, material);
terrain.position.set(0, -3.5, -4);
scene.add(terrain);

// ── 粒子点缀 ──
const particlesGeo = new THREE.BufferGeometry();
const particlesCount = 300;
const particlesPos = new Float32Array(particlesCount * 3);
for (let i = 0; i < particlesCount; i++) {
  particlesPos[i * 3] = (Math.random() - 0.5) * 20;
  particlesPos[i * 3 + 1] = Math.random() * 5 - 0.5;
  particlesPos[i * 3 + 2] = (Math.random() - 0.5) * 16;
}
particlesGeo.setAttribute('position', new THREE.BufferAttribute(particlesPos, 3));
const particlesMat = new THREE.PointsMaterial({
  color: 0xc8d8e8,
  size: 0.04,
  transparent: true,
  opacity: 0.5,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
const particles = new THREE.Points(particlesGeo, particlesMat);
scene.add(particles);

// ── 鼠标视差 ──
let mouseX = 0, mouseY = 0;
let targetX = 0, targetY = 0;
window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth) * 2 - 1;
  mouseY = (e.clientY / window.innerHeight) * 2 - 1;
});

// ── 动画循环 ──
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  uniforms.uTime.value += dt;

  // 平滑跟随鼠标
  targetX += (mouseX - targetX) * 0.02;
  targetY += (mouseY - targetY) * 0.02;
  camera.position.x = 18 + targetX * 3;
  camera.position.y = 16 + targetY * 2;
  camera.lookAt(0, -1.5, 0);

  // 粒子缓慢旋转
  particles.rotation.y += dt * 0.03;
  particles.rotation.x += dt * 0.01;

  renderer.render(scene, camera);
}
animate();

// ── 响应式 ──
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
